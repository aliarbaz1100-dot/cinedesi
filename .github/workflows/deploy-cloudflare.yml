name: Deploy CineDesi to Cloudflare

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cinedesi-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build CineDesi
        run: npm run build

      - name: Smoke-check production build
        shell: bash
        run: |
          set -euo pipefail
          required=(
            dist/index.html
            dist/catalog.html
            dist/about.html
            dist/contact.html
            dist/media-kit.html
            dist/watch-on-cinedesi.html
            dist/privacy.html
            dist/robots.txt
            dist/sitemap.xml
            dist/feed.xml
            dist/_headers
            dist/consent.js
            dist/analytics.js
            dist/sw.js
            dist/7f3a2c91d8e64b0f9a5c3e2176d4b8f1.txt
          )
          for file in "${required[@]}"; do
            test -f "$file" || { echo "Missing required build artifact: $file"; exit 1; }
          done

          title_count="$(find dist -maxdepth 1 -type f -name 'title-*.html' | wc -l | tr -d ' ')"
          echo "Generated title pages: $title_count"
          test "$title_count" -ge 1000 || { echo "Too few functional title pages"; exit 1; }

          grep -q 'cinedesi-consent-default' dist/index.html
          grep -q 'cinedesi-shell-v27' dist/sw.js
          grep -q 'Never intercept document navigations' dist/sw.js
          if grep -q 'caches.put(e.request' dist/sw.js; then
            echo "Legacy service worker navigation interception detected"
            exit 1
          fi
          grep -q 'src="/analytics.js"' dist/index.html
          if grep -R -q 'googletagmanager.com/gtag/js' dist --include='*.html'; then
            echo "Direct Google Analytics loader found in production HTML"
            exit 1
          fi
          grep -q '/title-' dist/sitemap.xml
          grep -q 'title-jolly-llb-3-2025.html' dist/index.html
          grep -q 'CineDesi Media Kit' dist/media-kit.html
          grep -q 'VERIFIED IN-SITE PLAYBACK' dist/watch-on-cinedesi.html
          grep -q '<rss version="2.0"' dist/feed.xml
          grep -q 'CineDesi — Latest Movies & Series Discovery' dist/feed.xml
          if grep -q '/movie?slug=' dist/catalog.html; then
            echo "Legacy query movie URLs found in generated catalog"
            exit 1
          fi

          python - <<'PY'
          import pathlib, re
          catalog = pathlib.Path("dist/catalog.html").read_text(encoding="utf-8")
          links = set(re.findall(r'href="/(title-[^"]+\.html)"', catalog))
          missing = [name for name in sorted(links) if not (pathlib.Path("dist") / name).exists()]
          print(f"Catalog title links checked: {len(links)}")
          if missing:
              print("Missing generated title pages:", missing[:20])
              raise SystemExit(1)
          PY

          echo "CineDesi production smoke checks passed."

      - name: Archive production build
        uses: actions/upload-artifact@v4
        with:
          name: cinedesi-production-${{ github.sha }}
          path: dist
          retention-days: 14
          if-no-files-found: error

      - name: Verify Cloudflare credentials
        shell: bash
        run: |
          python - <<'PY'
          import json, os, urllib.request, urllib.error
          import re
          raw=os.environ["CLOUDFLARE_API_TOKEN_RAW"].strip()
          m=re.search(r'Bearer\s+([A-Za-z0-9._-]+)', raw, re.I)
          if m:
              token=m.group(1)
          else:
              lines=[x.strip().strip('"').strip("'") for x in raw.splitlines() if x.strip()]
              token=lines[0] if lines else ""
              if token.lower().startswith("bearer "):
                  token=token[7:].strip()
              token=re.split(r'\s+-H\s+|\s+curl\s+', token, maxsplit=1)[0].strip()
          account_raw=os.environ["CLOUDFLARE_ACCOUNT_ID_RAW"].strip()
          am=re.search(r'\b([a-fA-F0-9]{32})\b', account_raw)
          account=am.group(1) if am else account_raw.strip().strip('"').strip("'")
          endpoints=[
              ("Token verify","https://api.cloudflare.com/client/v4/user/tokens/verify"),
              ("Account lookup",f"https://api.cloudflare.com/client/v4/accounts/{account}"),
              ("Workers services",f"https://api.cloudflare.com/client/v4/accounts/{account}/workers/services"),
          ]
          failed=False
          for name,url in endpoints:
              req=urllib.request.Request(url,headers={"Authorization":f"Bearer {token}","User-Agent":"CineDesi-GitHub-Actions"})
              try:
                  with urllib.request.urlopen(req,timeout=30) as r:
                      body=json.loads(r.read().decode("utf-8","replace"))
                      print(f"{name} HTTP: {r.status} success={body.get('success')} errors={body.get('errors')}")
                      if not body.get("success",False): failed=True
              except urllib.error.HTTPError as e:
                  data=e.read().decode("utf-8","replace")
                  try: body=json.loads(data)
                  except Exception: body={}
                  print(f"{name} HTTP: {e.code} success={body.get('success')} errors={body.get('errors')}")
                  failed=True
          if failed:
              raise SystemExit(1)
          PY
        env:
          CLOUDFLARE_API_TOKEN_RAW: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID_RAW: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy existing cinedesi Worker
        shell: bash
        run: |
          python - <<'PY'
          import os, subprocess, sys
          import re
          raw=os.environ["CLOUDFLARE_API_TOKEN_RAW"].strip()
          m=re.search(r'Bearer\s+([A-Za-z0-9._-]+)', raw, re.I)
          if m:
              token=m.group(1)
          else:
              lines=[x.strip().strip('"').strip("'") for x in raw.splitlines() if x.strip()]
              token=lines[0] if lines else ""
              if token.lower().startswith("bearer "):
                  token=token[7:].strip()
              token=re.split(r'\s+-H\s+|\s+curl\s+', token, maxsplit=1)[0].strip()
          account_raw=os.environ["CLOUDFLARE_ACCOUNT_ID_RAW"].strip()
          am=re.search(r'\b([a-fA-F0-9]{32})\b', account_raw)
          account=am.group(1) if am else account_raw.strip().strip('"').strip("'")
          env=os.environ.copy()
          env["CLOUDFLARE_API_TOKEN"]=token
          env["CLOUDFLARE_ACCOUNT_ID"]=account
          raise SystemExit(subprocess.call(["npx","--yes","wrangler@4","deploy","--config","wrangler.jsonc"],env=env))
          PY
        env:
          CLOUDFLARE_API_TOKEN_RAW: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID_RAW: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Notify IndexNow
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          key="7f3a2c91d8e64b0f9a5c3e2176d4b8f1"
          for attempt in 1 2 3 4 5; do
            body="$(curl --fail --silent --show-error --location --max-time 20 "https://cinedesi.online/${key}.txt" || true)"
            if [ "$body" = "$key" ]; then
              break
            fi
            if [ "$attempt" -eq 5 ]; then
              echo "IndexNow key file was not reachable after deploy."
              exit 1
            fi
            sleep 3
          done
          npm run notify:indexnow
