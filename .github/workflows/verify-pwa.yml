name: Verify CineDesi PWA and movie navigation

on:
  push:
    branches: [fix/pwa-navigation-stability-20260919]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Check built entrypoints and installed-app shell
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const read = (file) => fs.readFileSync(file, 'utf8');
          for (const file of ['dist/index.html','dist/movie.html','dist/sw.js','dist/manifest.webmanifest']) {
            assert.ok(fs.existsSync(file), 'Missing built file: ' + file);
          }
          const home = read('dist/index.html');
          const movie = read('dist/movie.html');
          const sw = read('dist/sw.js');
          const jsAssets = [...home.matchAll(/<script[^>]+src=["']([^"']+)["']/g)].map(m => m[1]);
          assert.ok(jsAssets.some(p => p.includes('/assets/')), 'Homepage bundle missing');
          assert.ok(movie.includes('/assets/'), 'Movie page bundle missing');
          assert.ok(jsAssets.every(p => !p.endsWith('.ts')), 'Unbuilt TypeScript in deployed homepage');
          assert.ok(sw.includes('cinedesi-shell-v28'), 'Stale service worker deployed');
          assert.ok(sw.includes('movie.html'), 'Offline movie page missing from PWA shell');
          assert.ok(!sw.includes('event.respondWith') && !sw.includes('self.addEventListener("fetch"'), 'Service worker must not intercept iOS navigation');
          assert.ok(home.includes('setTimeout(function()'), 'Splash failsafe missing');
          assert.ok(read('src/main.ts').includes('/movie?slug='), 'Canonical movie route missing');
          assert.ok(!read('src/main.ts').includes('setTimeout(showInstall, 4200)'), 'Auto install banner still enabled');
          assert.ok(!home.includes('location.replace("/movie.html"'), 'Redundant redirect can loop in Cloudflare');
          assert.ok(read('src/movie.ts').includes('sdk.onerror'), 'Movie SDK error state is missing');
          for (const page of [home, movie]) {
            const bundles = [...page.matchAll(/(?:src|href)=["']([^"']+\/assets\/[^"']+)["']/g)].map(m => m[1]);
            for (const asset of bundles) {
              const path = 'dist/' + asset.split(/[?#]/, 1)[0].replace(/^\.\//, '').replace(/^\//, '');
              assert.ok(fs.existsSync(path), 'Broken script or stylesheet path: ' + path);
            }
          }
          assert.ok(!sw.includes('cinedesi-shell-v27'), 'Old service worker version deployed');
          console.log('PASS: build entrypoints, asset paths, movie routes, PWA shell, splash, and install popup');
          JS
      - name: Check service worker JavaScript syntax
        run: node --check dist/sw.js
      - name: Smoke-test actual built HTTP responses
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/cinedesi-preview.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" || true' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then break; fi
            sleep 1
          done
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          const base = 'http://127.0.0.1:4173';
          for (const [path,kind,expected] of [
            ['/', 'text/html', 'CineDesi'],
            ['/movie.html?slug=smoke-test', 'text/html', 'movie-page'],
            ['/manifest.webmanifest', 'application/manifest+json', 'start_url'],
            ['/sw.js', 'javascript', 'cinedesi-shell-v28']
          ]) {
            const response = await fetch(base+path);
            assert.equal(response.status, 200, path+' returned '+response.status);
            assert.ok(response.headers.get('content-type')?.includes(kind), path+' unexpected Content-Type '+response.headers.get('content-type'));
            assert.ok((await response.text()).includes(expected), path+' unexpected body');
            console.log('PASS HTTP', path, response.status);
          }
          JS

